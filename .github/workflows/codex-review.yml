name: Request Codex review
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  request-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = `<!-- codex-review:${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: pr.number
            });
            if (!comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker))) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number,
                body: `@codex review\n\n${marker}`
              });
            }
